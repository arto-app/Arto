[workspace]
resolver = "2"
members = ["crates/*"]
# No `default-members`: dioxus-cli 0.7 canonicalizes those paths relative to
# the directory it is invoked from, so `dx bundle` run inside crates/arto
# panics when the list names `crates/arto`. Building every member by default
# is cheap (the Quick Look static library is tiny) and keeps `dx` working.

[workspace.package]
# Stays 0.0.0 in git; CI stamps the release tag here before bundling
# (see .github/workflows/bundle.yml and crates/arto/build.rs).
version = "0.0.0"
authors = ["Alisue <lambdalisue@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/arto-app/Arto"

# Versions for crates used by more than one member live here so the members
# cannot drift apart again (arto and the Quick Look crate once declared different `sha2`
# majors). This only governs what our crates ask for; transitive dependencies
# such as wry may still pull an older major alongside. Members reference these
# with `<name>.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
html-escape = "0.2.15"
indoc = "2.0.7"
insta = { version = "1.48.0", features = ["glob"] }
keyboard-types = "0.7.0"
lol_html = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"
