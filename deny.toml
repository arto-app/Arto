# cargo-deny policy for `just arto::deny` and the CI rust job.
# https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates nothing here can replace directly. Most arrive through
# the Dioxus desktop stack (wry, tao, gtk on Linux); the rest come through
# direct dependencies (image, display-info, serde_yaml_ng, dark-light,
# keyring). Reviewed 2026-10; drop an entry once the named dependency moves
# off the crate.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros under the gtk-rs GTK3 bindings that wry/tao/muda use on Linux" },
  { id = "RUSTSEC-2024-0436", reason = "paste via pulp/exr under the image crate (arto and arboard)" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml_ng (arto-markdown's front matter); its latest release still uses it" },
  { id = "RUSTSEC-2025-0057", reason = "fxhash via display-info (arto) and selectors/kuchikiki (wry)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 under dark-light (arto) and keyring's secret-service store on Linux; none has moved to zbus 6 yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5, the same dark-light and keyring chain" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5, the same dark-light and keyring chain" },
]

[licenses]
version = 2
# Permissive licenses only; anything else fails until it is reviewed and
# added here deliberately.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate majors are common below wry and dioxus and are not ours to fix,
# so they are reported, not failed. Our own direct dependencies are kept in
# step through [workspace.dependencies].
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
# Every dependency comes from crates.io; a git source in the lockfile means
# a fork someone has to keep following, so it has to be argued for here.
unknown-git = "deny"
