name: "Nix"

# Build the flake's packages from scratch (`nix build`) on the Nix-capable
# platforms. A clean, non-incremental build of 20 minutes or more per leg, so
# ci.yml calls it on every push to main and only on pull requests that change
# the flake; evaluation alone is covered by the cheap flake-eval job there.
#
# Built from the archive GitHub serves for the commit, not from a checkout:
# only the archive has VERSION filled in, so only its build is the one
# `nix run github:arto-app/Arto` looks up in the cache.

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix write token; pushes happen only outside pull requests
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: lambdalisue/nix-github-release/.github/workflows/build.yml@v0.1.1
    with:
      packages: arto arto-page
      runners: '["blacksmith-6vcpu-macos-15", "blacksmith-4vcpu-ubuntu-2404", "blacksmith-4vcpu-ubuntu-2404-arm"]'
      # A cold cache (e.g. after a source-hash bump invalidates `arto-deps`)
      # makes the full dependency + crate build exceed 30m on the ubuntu runner.
      timeout-minutes: 60
      cachix-cache: arto
    secrets:
      # Pull requests pull from the cache but do not push into it.
      cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
