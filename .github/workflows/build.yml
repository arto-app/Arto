name: "Build"

on:
  push:
    branches:
      - "main"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # https://zenn.dev/mierune/articles/2af7b9e447712a
      - uses: chetan/git-restore-mtime-action@v2
      # Run via the Nix devShell so the toolchain (rustc, clippy, rustfmt,
      # dioxus-cli, node, pnpm) matches local development and never drifts.
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        if: github.event_name != 'pull_request'
        with:
          name: arto
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-
      - run: nix develop -c just check
      - run: nix develop -c just fmt && git diff --exit-code
    timeout-minutes: 30

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # https://zenn.dev/mierune/articles/2af7b9e447712a
      - uses: chetan/git-restore-mtime-action@v2
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        if: github.event_name != 'pull_request'
        with:
          name: arto
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      # Retry up to 3 times due to flaky NSScreen API tests in headless environment
      - name: Run tests
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3"
            if nix develop -c just test; then
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Test failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "All 3 attempts failed"
          exit 1
    timeout-minutes: 30

  # Windows cannot use the Nix devShell the other jobs rely on, so this job
  # installs the toolchain natively. It exists because Windows-only code paths
  # (the cfg(windows) named-pipe IPC, the hamburger menu, engine-owned menu
  # shortcuts) are invisible to the macOS and Linux legs and have already
  # regressed unnoticed.
  check-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `ring` (arto -> ureq -> rustls) assembles its primitives from source and
      # needs a different assembler per target: nasm on x86_64, clang on
      # aarch64. Neither is guaranteed to be present on the runner image.
      - uses: ilammy/setup-nasm@v1
        if: matrix.target == 'windows'
      - name: Install LLVM (clang, required by ring on aarch64)
        if: matrix.target == 'windows-arm64'
        run: choco install llvm --no-progress -y
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm is pinned via the renderer's packageManager field.
      - run: corepack enable
      # Installed from the upstream release rather than extractions/setup-just,
      # which has no windows-aarch64 binary. just itself ships both arches.
      - name: Install just
        shell: pwsh
        run: |
          $ver = '1.57.0'
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $url = "https://github.com/casey/just/releases/download/$ver/just-$ver-$arch-pc-windows-msvc.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\just.zip"
          Expand-Archive "$env:RUNNER_TEMP\just.zip" -DestinationPath "$env:RUNNER_TEMP\just"
          "$env:RUNNER_TEMP\just" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-check-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-check-${{ matrix.target }}-
      # `just fmt` is deliberately omitted: oxfmt rewrites renderer CSS that is
      # not oxfmt-clean as committed, and git's LF->CRLF conversion makes
      # `git diff --exit-code` fail here for reasons unrelated to the change.
      # Formatting stays gated by the macOS check job.
      - run: just check
      - run: just test
    timeout-minutes: 45

  build:
    needs: ["check", "test"]
    runs-on: ${{ matrix.os }}
    # macOS is the source of the notarized DMG and gates the Homebrew dispatch,
    # so it must succeed. Linux bundling is newer and less proven, so a Linux
    # failure is tolerated (visible as a red leg) and must not block the macOS
    # release. See the release job for the matching lenient upload.
    continue-on-error: ${{ matrix.target != 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS produces a .dmg; Linux targets produce a .deb (see justfile).
          - target: macos
            os: macos-latest
            artifacts: ./desktop/target/dx/arto/bundle/**/*.dmg
            # macOS builds have historically finished within 30m.
            timeout: 30
          - target: ubuntu
            os: ubuntu-latest
            artifacts: ./desktop/target/dx/arto/bundle/**/*.deb
            # A cold cargo cache pushes the full release build past 30m on the
            # Linux runners (same class of build the nix-check job budgets 60m for).
            timeout: 60
          - target: ubuntu-arm64
            os: ubuntu-24.04-arm
            artifacts: ./desktop/target/dx/arto/bundle/**/*.deb
            timeout: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # https://zenn.dev/mierune/articles/2af7b9e447712a
      - uses: chetan/git-restore-mtime-action@v2
      # Run via the Nix devShell so the toolchain (rustc, dioxus-cli, node,
      # pnpm) matches local development and produces distributable bundles.
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        if: github.event_name != 'pull_request'
        with:
          name: arto
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-build-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.target }}-
      - name: Set package version for bundle filename
        if: ${{ github.event_name == 'release' }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          perl -i -pe 's/^version = "0\.0\.0"/version = "'"${VERSION}"'"/' desktop/Cargo.toml
          echo "${VERSION}" > desktop/VERSION
      - run: nix develop -c just build
      - uses: actions/upload-artifact@v7
        with:
          name: arto-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
    timeout-minutes: ${{ matrix.timeout }}

  # Detect whether a pull request touches the Nix flake, so the expensive
  # nix-check job can be limited to PRs that actually change it. On non-PR
  # events the output is forced to "true" (nix-check always runs there).
  changes:
    runs-on: ubuntu-latest
    outputs:
      flake: ${{ steps.detect.outputs.flake }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "flake=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- flake.nix flake.lock | grep -q .; then
            echo "flake=true" >> "$GITHUB_OUTPUT"
          else
            echo "flake=false" >> "$GITHUB_OUTPUT"
          fi

  # Verify the flake's package output (`nix build`) still builds. This is a
  # clean, non-incremental build (~20-25m/leg), so on pull requests it runs
  # only when the flake itself changed; every push to main and every release
  # runs it unconditionally to catch bit-rot promptly.
  nix-check:
    needs: ["check", "test", "changes"]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.flake == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
          - target: ubuntu
            os: ubuntu-latest
          - target: ubuntu-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        if: github.event_name != 'pull_request'
        with:
          name: arto
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Write version file
        run: |
          VERSION=$(git describe --tags --always)
          echo "${VERSION#v}" > desktop/VERSION
      - run: nix build
    # A cold cache (e.g. after a source-hash bump invalidates `arto-deps`)
    # makes the full dependency + crate build exceed 30m on the ubuntu runner,
    # and macOS already finishes within ~2m of the old limit. Give real headroom.
    timeout-minutes: 60

  release:
    if: ${{ github.event_name == 'release' }}
    needs: [build]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      - run: find .
      - name: Build release body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Get existing release notes (handle null case)
          gh release view "${{ github.event.release.tag_name }}" --json body -q '.body // ""' > release_body.md

          # Remove existing installation block if present (for idempotency)
          perl -i -0777 -pe 's/<!-- ARTO_INSTALLATION_START -->.*?<!-- ARTO_INSTALLATION_END -->//gs' release_body.md

          # Append fresh installation instructions with markers
          cat >> release_body.md << BODY_EOF

          ---

          <!-- ARTO_INSTALLATION_START -->
          ## macOS Installation

          ### Installation Steps (2 Security Approvals Required)

          Due to Apple's security requirements, you'll need to approve **both the DMG file and the app itself**.

          #### Step 1: Open the DMG File

          1. **Download** the \`Arto_*.dmg\` file from the Assets section below
          2. **Double-click the DMG file**
             - Security warning appears: *"Apple cannot verify that this disk image does not contain malware"*
             - Click "OK" to dismiss
          3. **Open System Settings**
             - Apple menu () → System Settings → Privacy & Security
          4. **Allow the DMG** (in Security section at bottom)
             - You'll see: *"Arto_*.dmg" was blocked from use*
             - Click **"Open Anyway"** button
             - Enter your password
             - The DMG will now open

          #### Step 2: Install and Open the App

          5. **Copy the app**
             - Drag **Arto.app** from the DMG to your **Applications** folder
          6. **Double-click Arto.app** to launch
             - Security warning appears again: *"Arto cannot be opened because..."*
             - Click "OK" to dismiss
          7. **Allow the app** (same process as DMG)
             - Open System Settings → Privacy & Security
             - Scroll to Security section
             - Find: *"Arto" was blocked from use*
             - Click **"Open Anyway"**
             - Enter your password
          8. **Launch complete**
             - Arto will now start normally
             - Future launches won't require approval

          ### Why Two Approvals Are Needed

          macOS treats the DMG container and the app inside separately. Since both are unsigned,
          each requires manual approval through System Settings. This is standard macOS security
          for applications without Apple Developer ID certificates.

          ### Quick Method (Terminal - for advanced users)

          \`\`\`bash
          # Remove quarantine from DMG
          xattr -d com.apple.quarantine Arto_*.dmg
          open Arto_*.dmg

          # After copying to Applications, remove quarantine from app
          xattr -cr /Applications/Arto.app
          open /Applications/Arto.app
          \`\`\`

          ### Note for macOS Sequoia (15.0+) Users

          The right-click → "Open" shortcut no longer works for unsigned apps.
          You must use System Settings → Privacy & Security as described above.

          ---

          For more information, see the [README](https://github.com/${REPO}).
          <!-- ARTO_INSTALLATION_END -->
          BODY_EOF
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          # Lenient so a missing Linux .deb (tolerated build failure) does not
          # block the release. The macOS .dmg is still effectively required:
          # the release only runs after the mandatory macOS build, and the
          # downstream dispatch job fails if the aarch64 DMG is absent.
          artifactErrorsFailBuild: false
          artifacts: ./artifacts/**/*.dmg,./artifacts/**/*.deb
          removeArtifacts: true
          makeLatest: true
          bodyFile: release_body.md

  dispatch:
    if: ${{ github.event_name == 'release' }}
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_NO_V="${VERSION#v}"
          ASSET_NAME="Arto_${VERSION_NO_V}_aarch64.dmg"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ASSET_NAME}"

          echo "Downloading ${ASSET_NAME} from ${DOWNLOAD_URL}"
          curl -L -o "${ASSET_NAME}" "${DOWNLOAD_URL}"

          # Calculate SHA256
          SHA256=$(sha256sum "${ASSET_NAME}" | cut -d' ' -f1)
          echo "SHA256: ${SHA256}"

          # Export for next step
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHA256=${SHA256}" >> $GITHUB_ENV
      - name: Dispatch to Homebrew tap
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
          repository: arto-app/homebrew-tap
          event-type: update
          client-payload: '{"version": "${{ env.VERSION }}", "sha256": "${{ env.SHA256 }}"}'
