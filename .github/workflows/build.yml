name: "Build"

on:
  push:
    branches:
      - "main"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Every platform (macOS, Linux, Windows) is a first-class matrix entry in the
# check/test/build jobs. The Nix-vs-native toolchain difference is handled once
# by the local ./.github/actions/setup-toolchain composite action, so the jobs
# below stay small and only branch on the run command itself.
jobs:
  # arm64 legs are intentionally omitted from check/test: with no target_arch
  # cfg in the source, type-checking and unit tests are architecture-independent,
  # so arm64 would only duplicate the x64 result. arm64 coverage lives in the
  # build job, where the artifact architecture actually matters.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos, os: macos-latest }
          - { target: ubuntu, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-check-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-check-${{ matrix.target }}-
      - if: runner.os != 'Windows'
        run: nix develop -c just check
      - if: runner.os != 'Windows'
        run: nix develop -c just fmt && git diff --exit-code
      # `just fmt` is deliberately omitted on Windows: oxfmt rewrites renderer CSS
      # that is not oxfmt-clean as committed, and git's LF->CRLF conversion makes
      # `git diff --exit-code` fail here for reasons unrelated to the change.
      # Formatting stays gated by the macOS/Linux legs.
      - if: runner.os == 'Windows'
        run: just check
    # A cold Nix + cargo build on the Linux runners can exceed the old 30m
    # macOS-only budget (same class of build the nix-check job budgets 60m for).
    timeout-minutes: 60

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos, os: macos-latest }
          - { target: ubuntu, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-test-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-test-${{ matrix.target }}-
      # Linux CI is headless: tests that touch display/GUI APIs (screen bounds,
      # window creation) SIGSEGV without an X server. Provide a virtual one via
      # Xvfb. macOS has a real window server and Windows runs natively, so
      # neither needs it.
      - name: Install Xvfb (Linux headless display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Retry up to 3 times due to flaky NSScreen API tests in headless environment
      - name: Run tests (Nix)
        if: runner.os != 'Windows'
        run: |
          # Wrap Linux runs in a virtual X display (see Xvfb step above).
          prefix=""
          if [ "$RUNNER_OS" = "Linux" ]; then prefix="xvfb-run -a"; fi
          for i in 1 2 3; do
            echo "Attempt $i/3"
            if $prefix nix develop -c just test; then
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Test failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "All 3 attempts failed"
          exit 1
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: just test
    timeout-minutes: 60

  build:
    needs: ["check", "test"]
    runs-on: ${{ matrix.os }}
    # macOS is the source of the notarized DMG and gates the Homebrew dispatch,
    # so it must succeed. Linux and Windows bundling are newer and less proven,
    # so their failures are tolerated (visible as red legs) and must not block
    # the macOS release. See the release job for the matching lenient upload.
    continue-on-error: ${{ matrix.target != 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS produces a .dmg, Linux a .deb plus an .AppImage (the .deb
          # installs only on Debian/Ubuntu, so the AppImage is what every other
          # distro runs), Windows an NSIS installer
          # (Arto_<version>_<arch>-setup.exe); see the justfile bundle recipes.
          - target: macos
            os: macos-latest
            artifacts: ./desktop/target/dx/arto/bundle/**/*.dmg
            # The devShell used to supply a prebuilt `dx`; building natively
            # adds a ~10m `cargo install dioxus-cli` whenever the cache misses,
            # which no longer fits the old 30m budget.
            timeout: 60
          - target: ubuntu
            os: ubuntu-latest
            artifacts: |
              ./desktop/target/dx/arto/bundle/**/*.deb
              ./desktop/target/dx/arto/bundle/**/*.AppImage
            # A cold cargo cache pushes the full release build past 30m on the
            # Linux runners (same class of build the nix-check job budgets 60m for).
            timeout: 60
          - target: ubuntu-arm64
            os: ubuntu-24.04-arm
            artifacts: |
              ./desktop/target/dx/arto/bundle/**/*.deb
              ./desktop/target/dx/arto/bundle/**/*.AppImage
            timeout: 60
          - target: windows
            os: windows-latest
            artifacts: ./desktop/target/dx/arto/bundle/**/*-setup.exe
            timeout: 60
          - target: windows-arm64
            os: windows-11-arm
            artifacts: ./desktop/target/dx/arto/bundle/**/*-setup.exe
            timeout: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Native, never the Nix devShell: a devShell build bakes /nix/store paths
      # into the binary (ELF interpreter and RUNPATH on Linux, the libiconv
      # install name on macOS), which no machine without that store can
      # resolve. The `verify bundle` step below enforces this.
      - uses: ./.github/actions/setup-toolchain
        with:
          toolchain: native
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            # Cache only the cargo-installed `dx` binary, not all of
            # ~/.cargo/bin: restoring the whole directory could clobber the
            # rustup/cargo shims installed earlier in the job.
            ~/.cargo/bin/dx*
            desktop/target
          key: cargo-build-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.target }}-
      # `just build` drives `dx bundle`, so every leg needs dioxus-cli.
      # Version-matched to the devShell's dioxus-cli so local and CI bundles
      # come out of the same tool. A cached `dx` is reused only when its
      # version matches, so bumping the pin forces a reinstall even before
      # Cargo.lock (the cache key) changes; otherwise the ~10m rebuild is
      # skipped.
      - name: Install dioxus-cli (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          want='0.7.9'
          if dx --version 2>/dev/null | grep -qF "$want"; then
            echo "dx $want already present, skipping install"
          else
            cargo install dioxus-cli --version "$want" --locked --force
          fi
      - name: Install dioxus-cli (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = '0.7.9'
          $have = if (Get-Command dx -ErrorAction SilentlyContinue) { (dx --version) } else { '' }
          if ($have -match [regex]::Escape($want)) {
            Write-Host "dx $want already present, skipping install"
          } else {
            cargo install dioxus-cli --version $want --locked --force
          }
      # Stamp the release version into the bundle filename. Split by toolchain so
      # each runner uses its native shell (bash/perl on Unix, pwsh on Windows)
      # rather than relying on Git Bash's perl on the otherwise-native Windows leg.
      - name: Set package version (Unix)
        if: github.event_name == 'release' && runner.os != 'Windows'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          perl -i -pe 's/^version = "0\.0\.0"/version = "'"${VERSION}"'"/' desktop/Cargo.toml
          echo "${VERSION}" > desktop/VERSION
      - name: Set package version (Windows)
        if: github.event_name == 'release' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}" -replace '^v', ''
          (Get-Content desktop/Cargo.toml) -replace '^version = "0\.0\.0"', "version = `"$v`"" | Set-Content desktop/Cargo.toml
          Set-Content -NoNewline desktop/VERSION $v
      - run: just build
      # Refuse to publish a bundle that carries build-environment dependencies
      # or that cannot start. Windows never sees a Nix toolchain, so there is
      # nothing to check there.
      - name: Verify bundle
        if: runner.os != 'Windows'
        run: just verify-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: arto-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
    timeout-minutes: ${{ matrix.timeout }}

  # Detect whether a pull request touches the Nix flake, so the expensive
  # nix-check job can be limited to PRs that actually change it. On non-PR
  # events the output is forced to "true" (nix-check always runs there).
  changes:
    runs-on: ubuntu-latest
    outputs:
      flake: ${{ steps.detect.outputs.flake }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "flake=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- flake.nix flake.lock | grep -q .; then
            echo "flake=true" >> "$GITHUB_OUTPUT"
          else
            echo "flake=false" >> "$GITHUB_OUTPUT"
          fi

  # Verify the flake's package output (`nix build`) still builds. The flake is a
  # Nix artifact, so this covers only the Nix-capable platforms (macOS + Linux).
  # A clean, non-incremental build (~20-25m/leg), so on pull requests it runs
  # only when the flake itself changed; every push to main and every release
  # runs it unconditionally to catch bit-rot promptly.
  nix-check:
    needs: ["check", "test", "changes"]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.flake == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
          - target: ubuntu
            os: ubuntu-latest
          - target: ubuntu-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        if: github.event_name != 'pull_request'
        with:
          name: arto
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Write version file
        run: |
          VERSION=$(git describe --tags --always)
          echo "${VERSION#v}" > desktop/VERSION
      - run: nix build
    # A cold cache (e.g. after a source-hash bump invalidates `arto-deps`)
    # makes the full dependency + crate build exceed 30m on the ubuntu runner,
    # and macOS already finishes within ~2m of the old limit. Give real headroom.
    timeout-minutes: 60

  release:
    if: ${{ github.event_name == 'release' }}
    needs: [build]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      - run: find .
      - name: Build release body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Get existing release notes (handle null case)
          gh release view "${{ github.event.release.tag_name }}" --json body -q '.body // ""' > release_body.md

          # Remove existing installation block if present (for idempotency)
          perl -i -0777 -pe 's/<!-- ARTO_INSTALLATION_START -->.*?<!-- ARTO_INSTALLATION_END -->//gs' release_body.md

          # Append fresh installation instructions with markers
          cat >> release_body.md << BODY_EOF

          ---

          <!-- ARTO_INSTALLATION_START -->
          ## macOS Installation

          ### Installation Steps (2 Security Approvals Required)

          Due to Apple's security requirements, you'll need to approve **both the DMG file and the app itself**.

          #### Step 1: Open the DMG File

          1. **Download** the \`Arto_*.dmg\` file from the Assets section below
          2. **Double-click the DMG file**
             - Security warning appears: *"Apple cannot verify that this disk image does not contain malware"*
             - Click "OK" to dismiss
          3. **Open System Settings**
             - Apple menu () → System Settings → Privacy & Security
          4. **Allow the DMG** (in Security section at bottom)
             - You'll see: *"Arto_*.dmg" was blocked from use*
             - Click **"Open Anyway"** button
             - Enter your password
             - The DMG will now open

          #### Step 2: Install and Open the App

          5. **Copy the app**
             - Drag **Arto.app** from the DMG to your **Applications** folder
          6. **Double-click Arto.app** to launch
             - Security warning appears again: *"Arto cannot be opened because..."*
             - Click "OK" to dismiss
          7. **Allow the app** (same process as DMG)
             - Open System Settings → Privacy & Security
             - Scroll to Security section
             - Find: *"Arto" was blocked from use*
             - Click **"Open Anyway"**
             - Enter your password
          8. **Launch complete**
             - Arto will now start normally
             - Future launches won't require approval

          ### Why Two Approvals Are Needed

          macOS treats the DMG container and the app inside separately. Since both are unsigned,
          each requires manual approval through System Settings. This is standard macOS security
          for applications without Apple Developer ID certificates.

          ### Quick Method (Terminal - for advanced users)

          \`\`\`bash
          # Remove quarantine from DMG
          xattr -d com.apple.quarantine Arto_*.dmg
          open Arto_*.dmg

          # After copying to Applications, remove quarantine from app
          xattr -cr /Applications/Arto.app
          open /Applications/Arto.app
          \`\`\`

          ### Note for macOS Sequoia (15.0+) Users

          The right-click → "Open" shortcut no longer works for unsigned apps.
          You must use System Settings → Privacy & Security as described above.

          ---

          For more information, see the [README](https://github.com/${REPO}).
          <!-- ARTO_INSTALLATION_END -->
          BODY_EOF
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          # Lenient so a missing Linux artifact or Windows installer (tolerated
          # build failures) does not block the release. The macOS .dmg is still
          # effectively required: the release only runs after the mandatory macOS
          # build, and the downstream dispatch job fails if the aarch64 DMG is absent.
          artifactErrorsFailBuild: false
          artifacts: ./artifacts/**/*.dmg,./artifacts/**/*.deb,./artifacts/**/*.AppImage,./artifacts/**/*-setup.exe
          removeArtifacts: true
          makeLatest: true
          bodyFile: release_body.md

  dispatch:
    if: ${{ github.event_name == 'release' }}
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_NO_V="${VERSION#v}"
          ASSET_NAME="Arto_${VERSION_NO_V}_aarch64.dmg"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ASSET_NAME}"

          echo "Downloading ${ASSET_NAME} from ${DOWNLOAD_URL}"
          curl -L -o "${ASSET_NAME}" "${DOWNLOAD_URL}"

          # Calculate SHA256
          SHA256=$(sha256sum "${ASSET_NAME}" | cut -d' ' -f1)
          echo "SHA256: ${SHA256}"

          # Export for next step
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
      - name: Dispatch to Homebrew tap
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
          repository: arto-app/homebrew-tap
          event-type: update
          client-payload: '{"version": "${{ env.VERSION }}", "sha256": "${{ env.SHA256 }}"}'
