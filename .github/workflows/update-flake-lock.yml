name: "Update flake.lock"

# Dependabot does not understand Nix flakes, so the flake inputs (nixpkgs,
# crane) are refreshed by this scheduled job instead. It opens a pull request
# with the new flake.lock.
#
# The PR is created with the FLAKE_LOCK_TOKEN secret, a fine-grained personal
# access token with read and write access to Contents and Pull requests on this
# repository. The workflow's own GITHUB_TOKEN is not used because GitHub does
# not start workflows for events caused by it (a guard against recursive runs),
# so CI would never run on the PR. Without the secret the job falls back to
# GITHUB_TOKEN: the PR still opens, but CI needs a close and reopen.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}
          pr-title: "nix: update flake.lock"
          commit-msg: "nix: update flake.lock"
          pr-labels: dependencies
