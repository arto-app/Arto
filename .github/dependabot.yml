# Keeps Cargo, pnpm and GitHub Actions dependencies moving without a manual
# sweep. Nix flake inputs are not covered by Dependabot; see
# .github/workflows/update-flake-lock.yml for those.
#
# Minor and patch bumps are grouped into one PR per ecosystem so the review
# cost stays flat; major bumps stay separate because each one needs its own
# API check (see the dependency-update notes in CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Adopt a new release only after it has been public for a week, so a
    # compromised or yanked release is usually caught upstream first.
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # arto-keybindings shares Key / Code / Modifiers with dioxus-html, muda
      # and global-hotkey, so keyboard-types has to stay on the version those
      # crates use (0.7 as of dioxus 0.7.10 and muda 0.17). Drop this entry
      # once they move; patch releases are still picked up.
      - dependency-name: keyboard-types
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Adopt a new release only after it has been public for a week, so a
    # compromised or yanked release is usually caught upstream first.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Adopt a new release only after it has been public for a week, so a
    # compromised or yanked release is usually caught upstream first.
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
