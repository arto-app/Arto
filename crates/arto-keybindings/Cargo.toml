[package]
name = "arto-keybindings"
description = "Arto's keybinding model: shortcut parsing, binding sets, presets, and the sequence-matching engine. Last version published to crates.io: Arto installs from its releases at https://github.com/arto-app/Arto"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["keybindings", "shortcuts", "keyboard", "gui"]
categories = ["gui", "config"]
# Part of the app, not a library others build on: only the renderer,
# released from arto-app/arto-markdown, is published.
publish = false

[dependencies]
# The same crate Dioxus and muda re-export their `Key`, `Code` and
# `Modifiers` from, so chords built here compare equal to the app's events.
keyboard-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[dev-dependencies]
indoc.workspace = true
