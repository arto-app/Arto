[package]
name = "arto"
description = "Arto, the Art of Reading Markdown"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["markdown", "viewer", "github", "desktop", "dioxus"]
categories = ["gui", "text-processing"]
# The frontend bundle under assets/frontend is build output copied in by the
# frontend build (see frontend/vite.config.ts), so git ignores it and a
# package would not carry it. A release binary compiles those two files in,
# which is what makes `cargo install arto` produce something that runs; list
# them so a package that lost them cannot be published.
include = [
  "src/**",
  "build.rs",
  "assets/Arto.png",
  "assets/arto-header-welcome-dark.png",
  "assets/arto-header-welcome-light.png",
  "assets/welcome.md",
  "assets/frontend/main.css",
  "assets/frontend/main.js",
  "assets/frontend/icons/tabler-sprite.svg",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
arboard = "3.6.1"
arto-config.workspace = true
arto-ipc.workspace = true
arto-keybindings.workspace = true
arto-markdown.workspace = true
arto-page.workspace = true
base64.workspace = true
dark-light = "3.0.0"
chrono = { version = "0.4", features = ["serde"] }
clap.workspace = true
compile-time = "0.3"
dirs.workspace = true
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-desktop = "0.7.10"
dotenvy = "0.15.7"
html-escape.workspace = true
image = "0.25.10"
indoc.workspace = true
notify-debouncer-full = "0.7.0"
open = "5.4.3"
parking_lot = "0.12"
percent-encoding = "2.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["sync", "time"] }
tracing.workspace = true
ureq = "3.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["v4"] }
display-info = "0.5.9"
flate2 = "1.1"
mouse_position = "0.1.4"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
core-graphics = "0.25"
core-foundation = "0.10.1"
tracing-oslog = "0.3.0"

[build-dependencies]
flate2 = "1.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
