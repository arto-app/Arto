preferences:
  lenses:
    lede: "An agent or a command that looks at the document you are reading and shows its answer with it — a translation in the page's places, a summary from the header, a note beside each paragraph. Nothing is sent anywhere until you open one."
    lenses_title: "Lenses"
    empty: "No lenses yet. Start from a recipe below, or from a blank one."
    blank: "Blank lens"
    cancel: "Cancel"
    recipes:
      title: "Start from a recipe"
      description: "A lens written in advance: pick one, fill in the language and who answers, and add it."
      add: "Add “%{label}”"
      between:
        label: "Between"
        hint: "Text in this language is translated into the other."
      and:
        label: "And"
        hint: "Text in this language is translated into the other; text in any other language, into this one."
      language:
        label: "Language"
        hint: "The language the answer is written in, named in English."
      audience:
        label: "For whom"
        hint: "Who the explanation is written for — a newcomer to the subject when left empty."
      translate_page:
        title: "Translate the page"
        description: "The whole document translated either way between two languages, taking the page's places block by block from the top."
      translate_beside:
        title: "Translation beside each block"
        description: "Each block translated either way between two languages, behind a mark in its margin, so the original stays as you read it."
      summarize:
        title: "Summarize"
        description: "The gist and the main points of the document, opened from the header."
      explain_terms:
        title: "Explain the terms"
        description: "A note beside each block that uses terms, abbreviations or names a newcomer may not know."
      critique:
        title: "Critique"
        description: "A note beside each block with a claim that lacks support, vague wording or a leap in logic."
      fact_check:
        title: "Fact check"
        description: "A note beside each block whose claims the web contradicts or cannot confirm, with its sources. The agent is allowed to search the web."
      explain_block:
        title: "Explain a block"
        description: "The block you pick from the menu, explained in plain words for the reader you name."
    asks:
      label: "Asks"
    model:
      label: "Model"
      recipe_choice: "The recipe's choice for %{agent}: %{model}."
      required_pick: "Required: pick one the server offers."
      required: "Required: the model the server runs."
      default: "Left empty, the agent's own default."
      asking: "Asking the agent for its models…"
      unlisted: "The models could not be listed: %{reason}"
    endpoint:
      label: "Endpoint"
    problem:
      not_ready: "Not ready: %{problem}"
      not_offered: "Not offered: %{problem}"
    display:
      page:
        title: "Replaces the page"
        description: "The answer takes the document's places, block by block from the top as it is written. For a translation."
      popover:
        title: "One answer on request"
        description: "Asked for the whole document from the header, or for one block from its menu, and shown in a popover. For a summary."
      annotate:
        title: "A note beside each block"
        description: "Every block is asked about on its own; each answer waits behind a mark in the margin. For a gloss or an explanation."
    prompt:
      per_block: "What the agent is asked about each block. The block comes after your prompt between <text> and </text>, and the blocks around it between <before> and </before> and <after> and </after> — so the prompt can say \"explain the terms in <text>\" and tell the agent to use the others as context only. An answer of <nothing/> alone leaves the block unmarked, so a prompt can say \"if there is nothing worth noting, answer with exactly <nothing/>\". Left empty, the agent is handed the block alone."
      whole: "What the agent is asked to do with the text, which comes after your prompt and a blank line with nothing around it — call it \"the text\". Left empty, the agent is handed the text alone, which is what a model trained for one task, such as translation, expects."
    agents:
      command:
        name: "Command"
        description: "A program of your own, handed the request as JSON."
      claude:
        introduction: "The claude command, signed in as you already are."
        description: "The claude command, signed in as you already are."
      codex:
        introduction: "The codex command, signed in as you already are."
        description: "The codex command, signed in as you already are."
      ollama:
        introduction: "A model running on this machine through Ollama; nothing leaves it."
        description: "An Ollama server, through its own API."
        endpoint_hint: "Left empty, http://127.0.0.1:11434."
      openai:
        introduction: "OpenAI, or a server with an OpenAI-compatible API."
        description: "A server with an OpenAI-compatible API — LM Studio, llama.cpp, OpenAI and the like."
        endpoint_hint: "The base URL, the part before /chat/completions. Left empty, https://api.openai.com/v1 — OpenAI itself."
    capabilities:
      web_search:
        label: "Search the web"
        description: "For a fact check. The agent may search for what the text says and read the pages it finds; what it sends out is what it was already handed."
      read_files:
        label: "Read files around the document"
        description: "The document can ask the agent to read the files beside it and write them into its answer, or send them out through a search. Allow it only for documents you trust. Opened again by itself, the lens shows what it answered before and asks nothing."
      shell:
        label: "Run commands"
        description: "Everything reading files allows, and whatever a command can do: codex keeps its commands from writing; claude does not. Allow it only for documents you trust."
    problems:
      empty_id: "a lens has an empty id"
      duplicate_id: "lens %{id} is defined more than once"
      nothing_to_run: "lens %{id} has neither an agent nor a command to run"
      agent_and_command: "lens %{id} has both an agent and a command; it can run one"
      missing_model: "lens %{id} asks a server, which needs a model"
      not_for_agent: "lens %{id} sets %{setting}, which only a server agent uses"
      not_allowed: "lens %{id} allows %{capability}, which %{agent} cannot be given"
      unit_without_page: "lens %{id} hands the document over by block, which only a page lens does"
      page_on_block: "lens %{id} is a page lens, which looks at a whole document, not a block"
      shortcut: "lens %{id} has a shortcut that cannot be read: %{reason}"
      concurrency: "lens %{id} must allow between 1 and %{max} runs at a time"
      context: "lens %{id} may hand at most %{max} neighbours on each side"
      timeout: "lens %{id} must allow its command at least a second"
    card:
      edit: "Edit"
      close: "Close"
      remove: "Remove"
    form:
      label:
        label: "Label"
        hint: "What the menus call it."
      id:
        label: "ID"
        hint: "Unique among the lenses; earlier answers are kept under it."
      shortcut:
        label: "Shortcut"
        hint: "Keys that show or hide the lens while reading, written as in Keybindings: Cmd+Shift+t, or g t for one after another."
        taken: "Not bound: these keys already belong to %{holder}."
      display: "How the answer is shown"
      unit:
        label: "Handed over"
        description: "The whole document in one run suits a general model; one block per run suits a small translation model."
        document: "Whole document"
        block: "Block by block"
      on:
        label: "Looks at"
        description: "Where the right-click menu offers it: Lens on Block, Lens on Document, or both. A shortcut shows a lens that looks at a block only over the block the cursor is on."
        either: "Either"
        block: "A block"
        document: "The document"
      command:
        label: "Command"
        hint: "The program, then each argument on a line of its own. It is run as written, without a shell."
      prompt: "Prompt"
      message: "What the agent is sent"
      system:
        label: "System prompt"
        hint: "Sent with every request."
      api_key_command:
        label: "API key command"
        hint: "Instead of a stored key: a program that prints it — a password manager such as 1Password's op — then each argument on a line of its own. It is run for every request."
      program:
        label: "Program"
        hint: "Where the program is, when it is not found on its own."
      context_length:
        label: "Context length"
        hint: "In tokens. Left empty, sized to each request."
      context:
        label: "Context"
        hint: "Blocks on each side handed over with each block, at most %{max}."
      concurrency:
        label: "Runs at once"
        hint: "1 to %{max}."
      timeout:
        label: "Timeout"
        hint: "Seconds one run may take before it counts as failed."
    api_key:
      label: "API key"
      no_endpoint: "Set the endpoint first: the key is kept for it."
      stored: "A key is stored for %{account}."
      replace: "Replace"
      remove: "Remove"
      placeholder: "Paste the key"
      save: "Save"
      overridden: "Not used while an API key command is set below."
      hint: "Kept in the system's credential store — the Keychain on macOS — under the endpoint, never in config.json, and used by every lens that asks the same server. A server that wants no key, such as a local Ollama, needs none."
