      retry: "%{label} の失敗した箇所を再試行（%{count}）"
      regenerate: "%{label} の変更箇所を再生成（%{count}）"
      continue: "%{label} を続行（残り %{count}）"
      continue_and_regenerate: "%{label} を続行し、変更箇所を再生成（%{count}）"
    badge:
      failed: "失敗"
