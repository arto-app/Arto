[application]
name = "Arto"
default_platform = "desktop"

[bundle]
identifier = "com.lambdalisue.Arto"
publisher = "lambdalisue"
# One artwork per platform's format: the .icns goes into the macOS bundle, the
# .png into the Linux packages, and the .ico is linked into arto.exe as its
# icon resource — the icon Explorer draws on the executable, on the Start menu
# shortcut and, through the ProgID's `arto.exe,0`, on every document Arto
# opens. The CLI takes the first `.ico` in this list for that; with none in it
# the executable is stamped with the CLI's own default icon instead, which is
# Dioxus' logo. Regenerate the .ico from `assets/Arto.png` with
# platform/windows/make-icon.py.
icon = [
  "../../platform/macos/bundle/Arto.icns",
  "../../platform/windows/Arto.ico",
  "assets/Arto.png",
]
copyright = "Copyright 2025 lambdalisue"
category = "Utility"
short_description = "A GitHub Markdown viewer"
long_description = """
Arto is a GitHub Markdown viewer built with Dioxus.
"""

# Every shared library the binary links directly (the DT_NEEDED entries, minus
# the C runtime), so `apt install ./arto.deb` pulls them in instead of leaving
# the user to decode a bare dynamic-linker error. Listed even where WebKitGTK
# would drag them in anyway: relying on another package's dependencies is how a
# package silently breaks when a distro splits or renames one. The alternatives
# cover Ubuntu's time64 renaming, which Debian does not use.
[bundle.deb]
depends = [
  "libwebkit2gtk-4.1-0",
  "libjavascriptcoregtk-4.1-0",
  "libgtk-3-0t64 | libgtk-3-0",
  "libglib2.0-0t64 | libglib2.0-0",
  "libsoup-3.0-0",
  "libpango-1.0-0",
  "libcairo2",
  "libcairo-gobject2",
  "libgdk-pixbuf-2.0-0",
  "libxcb1",
  "libxdo3",
  "libssl3t64 | libssl3",
]

# The generated NSIS script installs the binary and nothing else, so the hook
# script adds the registry keys that tell Windows which documents Arto opens —
# the counterpart to CFBundleDocumentTypes in the macOS Info.plist.
[bundle.windows.nsis]
installer_hooks = "../../platform/windows/file-associations.nsh"
# The installer's own icon. The `[bundle] icon` list above is what the
# installed executable wears; this is only the setup program's window and its
# file in Downloads, and NSIS draws its own logo without it.
installer_icon = "../../platform/windows/Arto.ico"

[bundle.macos]
license = "../../LICENSE"
provider_short_name = "Alisue"
info_plist_path = "../../platform/macos/bundle/Info.plist"
files = {}
hardened_runtime = false # because we don't have a proper Apple Developer ID
signing_identity = "-" # use ad-hoc signing for ARM64 compatibility
