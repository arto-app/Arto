[package]
name = "arto-frontend"
description = "Moved: Arto's frontend bundles are now arto-markdown's `frontend` feature"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["markdown", "mermaid", "katex", "highlight", "webview"]
categories = ["text-processing", "web-programming"]
include = ["src/**"]

[dependencies]
arto-markdown = { workspace = true, features = ["frontend"] }
