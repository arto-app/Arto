[package]
name = "arto-markdown"
description = "Arto's Markdown to HTML rendering pipeline"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["markdown", "html", "github", "renderer", "commonmark"]
categories = ["text-processing"]
# Released from arto-app/arto-markdown, which publishes it to crates.io; this
# copy is what the app builds against until it depends on that release.
publish = false

[dependencies]
base64.workspace = true
html-escape.workspace = true
lol_html.workspace = true
ox_content_allocator = "3.1.0"
ox_content_ast = "3.1.0"
ox_content_parser = "3.1.0"
ox_content_renderer = "3.1.0"
serde.workspace = true
schemars = { workspace = true, optional = true }
serde_yaml_ng = "0.10"
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
percent-encoding = "2.3.2"

[features]
# `JsonSchema` for the options that are also a section of Arto's `config.json`,
# so the configuration crate can describe that file without redefining them.
schemars = ["dep:schemars"]
# `frontend`: the stylesheet, the runtime and the library bundles that draw
# the HTML in a page, for a host that shows documents rather than only
# writing them.
frontend = []

[dev-dependencies]
indoc.workspace = true
insta.workspace = true
serde_json.workspace = true
tempfile.workspace = true
