[package]
name = "arto-markdown"
description = "Arto's Markdown to HTML rendering pipeline"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
html-escape.workspace = true
lol_html.workspace = true
# ox-content is still in beta and its pre-releases move fast; pin exactly so a
# `cargo update` cannot swap the parser or the HTML it writes unnoticed. The
# four crates are one release train and must stay on the same version.
ox_content_allocator = "=3.0.0-beta.16"
ox_content_ast = "=3.0.0-beta.16"
ox_content_parser = "=3.0.0-beta.16"
ox_content_renderer = "=3.0.0-beta.16"
serde.workspace = true
serde_yaml_ng = "0.10"
tracing.workspace = true
url = "2"

[dev-dependencies]
indoc.workspace = true
insta.workspace = true
serde_json.workspace = true
tempfile.workspace = true
