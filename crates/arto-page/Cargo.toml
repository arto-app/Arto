[package]
name = "arto-page"
description = "Render Markdown into a self-contained HTML page with Arto's styling"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["markdown", "html", "github", "renderer", "cli"]
categories = ["text-processing", "command-line-utilities"]
# The stylesheet and the page runtime under assets/ are build output copied in
# by the frontend build (see frontend/vite.config.ts); list them so a package
# cannot be published without them. The library bundles come from
# arto-frontend.
include = [
  "src/**",
  "assets/frontend/main.css",
  "assets/frontend/page.iife.js",
]

[lib]
name = "arto_page"
# `staticlib` is what the macOS Quick Look extension links; it only carries
# the C ABI when the `ffi` feature is on.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "arto-page"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The clap argument surface shared by the `arto-page` binary and `arto page`.
# A consumer that only wants `render_file` can turn it off to skip clap.
cli = ["dep:clap"]
# C ABI for the Quick Look preview extension. Off by default so the symbols
# never end up in binaries that merely depend on this crate.
ffi = []

[dependencies]
# The page honours the user's config.json (rendering options, default theme)
# so `arto page` and Quick Look look like the app does.
arto-config.workspace = true
arto-frontend.workspace = true
arto-markdown.workspace = true
base64.workspace = true
clap = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
