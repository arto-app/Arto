[package]
name = "arto-page"
description = "Render Markdown into a self-contained HTML page with Arto's styling. Last version published to crates.io: Arto installs from its releases at https://github.com/arto-app/Arto"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["markdown", "html", "github", "renderer", "cli"]
categories = ["text-processing", "command-line-utilities"]
# Part of the app, not a library others build on: only the renderer
# (arto-markdown, and arto-frontend under its old name) is published.
publish = false

[lib]
name = "arto_page"
# `staticlib` is what the macOS Quick Look extension links; it only carries
# the C ABI when the `ffi` feature is on.
crate-type = ["lib", "staticlib"]

[[bin]]
name = "arto-page"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The clap argument surface shared by the `arto-page` binary and `arto page`.
# A consumer that only wants `render_file` can turn it off to skip clap.
cli = ["dep:clap"]
# C ABI for the Quick Look preview extension. Off by default so the symbols
# never end up in binaries that merely depend on this crate.
ffi = []

[dependencies]
# The page honours the user's config.json (rendering options, default theme)
# so `arto page` and Quick Look look like the app does.
arto-config.workspace = true
arto-markdown = { workspace = true, features = ["frontend"] }
base64.workspace = true
clap = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
