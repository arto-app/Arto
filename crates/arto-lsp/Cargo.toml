[package]
name = "arto-lsp"
description = "Arto's wire protocol: JSON-RPC 2.0 in LSP framing, and the local socket a second launch hands its request to"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["ipc", "single-instance", "socket"]
categories = ["os", "network-programming"]

[dependencies]
# `FileOpenBehavior` and `Theme` travel on the wire exactly as they are
# spelled in config.json, so the protocol borrows those types rather than
# keeping copies that could drift. They live in a leaf crate of their own so
# that borrowing them does not pull the configuration (and through it the
# Markdown pipeline and the keybindings) into the dependency graph.
arto-types.workspace = true
dirs.workspace = true
interprocess = "2.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile.workspace = true
