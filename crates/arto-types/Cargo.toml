[package]
name = "arto-types"
description = "Values Arto's configuration and its wire protocol both spell: the theme preference and where an opened file goes"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["arto", "config", "types"]
categories = ["config"]

[dependencies]
serde.workspace = true
schemars = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# `JsonSchema` for the types, so the configuration crate can describe
# `config.json` without redefining them.
schemars = ["dep:schemars"]

[dev-dependencies]
serde_json.workspace = true
